[package]
name = "git-bonsai"
version = "0.3.1-alpha.1"
authors = ["Aurélien Gâteau <mail@agateau.com>"]
edition = "2018"
description = "Command-line tool to clean the branches of your git garden"
documentation = "https://github.com/agateau/git-bonsai"
readme = "README.md"
homepage = "https://github.com/agateau/git-bonsai"
repository = "https://github.com/agateau/git-bonsai"
license = "GPL-3.0+"
keywords = ["git", "clean"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
structopt = "0.3.26"
dialoguer = "0.12.0"
console = "0.16.2"
thiserror = "2.0.17"
crossterm = "0.29.0"
ratatui = "0.30.0"
derive_setters = "0.1.8"

[dev-dependencies]
assert_fs = "1.0.7"
predicates = "2.1.1"
claim = "0.5.0"
yare = "3.0.0"
